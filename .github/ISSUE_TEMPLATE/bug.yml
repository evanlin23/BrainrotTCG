name: Bug report
description: Report one reproducible problem; search existing issues first.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues and PRs before filing. Report one problem; keep private saves, identity keys and other secrets out of attachments.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Include the starting state and minimal steps. Mark an unconfirmed report clearly.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Browser/version, OS/device, viewport, game URL or revision, relevant errors or sanitized screenshots. Distinguish emulation from a real device.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related issues or attempted workarounds
      description: Link existing reports or PRs; say which workaround helps, if known.
