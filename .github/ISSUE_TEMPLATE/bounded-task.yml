name: Bounded task
description: Propose one deliverable with acceptance and verification; slice larger trackers first.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: Search existing issues and PRs first. Reuse an existing issue when possible; split unrelated outcomes into separate tasks before assigning work.
  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome and acceptance criteria
      description: State the concrete problem, resulting behavior and how a reviewer will know this one task is complete.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, dependencies and exclusions
      description: Link prerequisites or conflicting PRs. Identify intended boundaries and what this task will leave for other issues.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Name available commands and meaningful regression or manual cases. Mark proposed runners and evidence that remains unrun.
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: Coordination
      description: Note the proposed owner, base branch and overlapping files or agents. Assignment requires agreement; this form does not claim ownership.
