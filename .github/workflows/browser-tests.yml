name: Browser Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  # The suite runs in three shards at once to cut wall time; each shard keeps one worker, since the
  # specs were written to run one at a time.
  browser-shard:
    name: browser-tests shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Link-preview pictures (scripts/preview-pages.ts) take minutes to draw from scratch; keep them.
      # The key covers everything that decides which pictures there are and how they look. Their
      # cache contract (the script, sharp's versions, PREVIEW_CACHE_VERSION) starts the restore
      # prefix too, so pictures drawn under an older contract are never restored.
      - id: previews
        run: |
          contract=$(npx tsx scripts/preview-pages.ts --cache-contract)
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ steps.previews.outputs.contract }}-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/engine/**', 'src/content/sets/index.ts', 'src/content/sets/*/*.json', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp', 'package-lock.json') }}
          restore-keys: previews-${{ steps.previews.outputs.contract }}-
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/3
      # The deploy also builds for the root on Cloudflare Pages (docs/HOSTING.md): smoke that build too,
      # once, in the first shard.
      - name: Smoke the build for the root path
        if: matrix.shard == 1
        env:
          BASE_PATH: /
          SITE_URL: https://brainrottcg.pages.dev/
        run: npx playwright test tests/browser/built-site.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Pull requests only: every browser spec the PR adds or changes runs 10 more times in both
  # projects, so a test that passes only some of the time fails here, before it merges. A PR that
  # changes no spec stops after the diff. Cost: about 10x each changed spec's run time, in parallel
  # with the shards.
  browser-burn-in:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The merge commit and its first parent (the base), to list what the PR changes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - id: changed
        run: |
          specs=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- 'tests/browser/*.spec.ts' | tr '\n' ' ')
          echo "Changed specs: ${specs:-none}"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.specs != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.specs != ''
        run: npm ci
      - if: steps.changed.outputs.specs != ''
        run: npx playwright install --with-deps chromium
      - id: previews
        if: steps.changed.outputs.specs != ''
        run: |
          contract=$(npx tsx scripts/preview-pages.ts --cache-contract)
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.specs != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ steps.previews.outputs.contract }}-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/engine/**', 'src/content/sets/index.ts', 'src/content/sets/*/*.json', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp', 'package-lock.json') }}
          restore-keys: previews-${{ steps.previews.outputs.contract }}-
      - if: steps.changed.outputs.specs != ''
        env:
          SPECS: ${{ steps.changed.outputs.specs }}
        run: |
          # SPECS is a space-separated list of spec paths, split on purpose.
          # shellcheck disable=SC2086
          npx playwright test $SPECS --repeat-each=10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results-burn-in
          path: test-results/
          retention-days: 7

  # The check that branch protection and reviews look for: it passes only when every shard passed
  # and, on a pull request, the burn-in passed too (it is skipped on pushes).
  browser-tests:
    needs: [browser-shard, browser-burn-in]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard and the burn-in to pass
        env:
          RESULT: ${{ needs.browser-shard.result }}
          BURN_IN: ${{ needs.browser-burn-in.result }}
        run: |
          echo "Shards: $RESULT. Burn-in: $BURN_IN"
          test "$RESULT" = success
          test "$BURN_IN" = success || test "$BURN_IN" = skipped
