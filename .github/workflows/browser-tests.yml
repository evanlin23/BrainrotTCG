name: Browser Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp') }}
          restore-keys: previews-
      - run: npm run test:browser
      # The deploy also builds for the root on Cloudflare Pages (docs/HOSTING.md): smoke that build too.
      - name: Smoke the build for the root path
        env:
          BASE_PATH: /
          SITE_URL: https://brainrottcg.pages.dev/
        run: npx playwright test tests/browser/built-site.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
