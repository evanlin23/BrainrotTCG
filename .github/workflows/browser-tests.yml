name: Browser Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job here that runs Playwright (the shards, the burn-in, the cross-browser smoke and the visual
# baselines) runs in Playwright's official image, whose tag must equal the installed @playwright/test
# (a test in scripts/hof-workflows.test.ts checks it and that the digest is pinned like the actions). The image
# already holds the browsers and their system libraries, so no run installs packages from an outside
# mirror: `playwright install --with-deps` runs apt-get update, which fails whenever one of the
# runner image's third-party apt sources is down or unsigned. Bump the tag and digest together with
# Playwright, in all four jobs (docs/DEVELOPMENT.md).
# `--user 1001` is the runner's user: Firefox won't run as root without a HOME, and the checkout and
# the npm cache belong to it. `--ipc=host` gives Chromium the host's /dev/shm, not Docker's 64 MB.
jobs:
  # The suite runs in three shards at once to cut wall time; each shard keeps one worker, since the
  # specs were written to run one at a time.
  browser-shard:
    name: browser-tests shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Link-preview pictures (scripts/preview-pages.ts) take minutes to draw from scratch; keep them.
      # The key covers everything that decides which pictures there are and how they look. Their
      # cache contract (the script, sharp's versions, PREVIEW_CACHE_VERSION) starts the restore
      # prefix too, so pictures drawn under an older contract are never restored.
      - id: previews
        run: |
          contract=$(npx tsx scripts/preview-pages.ts --cache-contract)
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ steps.previews.outputs.contract }}-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/engine/**', 'src/content/sets/index.ts', 'src/content/sets/*/*.json', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp', 'package-lock.json') }}
          restore-keys: previews-${{ steps.previews.outputs.contract }}-
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/3
      # The deploy also builds for the root on Cloudflare Pages (docs/HOSTING.md): smoke that build too,
      # once, in the first shard.
      - name: Smoke the build for the root path
        if: matrix.shard == 1
        env:
          BASE_PATH: /
          SITE_URL: https://brainrottcg.pages.dev/
        run: npx playwright test tests/browser/built-site.spec.ts
      # Staging (docs/HOSTING.md#staging): the same build is the staging copy at a subdomain of the
      # project host and the real game elsewhere. The deploy runs this config against real staging.
      - name: Check a staging copy is marked and kept apart
        if: matrix.shard == 1
        run: npx playwright test -c playwright.staging.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7


  # Cross-browser smoke (#658): the few journeys tagged @cross-browser (the first pack with its reload,
  # a card share, a pack share with its link opened again) on Firefox and WebKit, through
  # playwright.compat.config.ts.
  # - It runs in the same Playwright image as the shards (see the top of this file).
  # - Not part of `browser-tests` below and not required: it reports on its own. Making it a
  #   requirement is a separate decision once its runs have been stable (add it to that job's needs).
  # - WebKit is Playwright's Linux build with iPhone touch emulation, not iOS Safari or a phone.
  # - Its engine versions and pass, fail and skip counts go to the job summary.
  cross-browser-smoke:
    name: cross-browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: previews
        run: |
          contract=$(npx tsx scripts/preview-pages.ts --cache-contract)
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ steps.previews.outputs.contract }}-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/engine/**', 'src/content/sets/index.ts', 'src/content/sets/*/*.json', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp', 'package-lock.json') }}
          restore-keys: previews-${{ steps.previews.outputs.contract }}-
      - run: npm run test:browser:compat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results-cross-browser
          path: test-results/compat/
          retention-days: 7

  # Burn-in: the specs this branch adds or changes, and those that import a browser helper it
  # changes, run again with --repeat-each. A test that passes only some of the time fails here,
  # before it merges.
  # - scripts/burn-in-plan.ts picks the specs and the repeats: 10 when few specs changed, scaled
  #   to a fixed budget of spec runs as the list grows, never below 2, and never dropping a spec.
  #   The longest it can take is the whole suite twice, split over 3 shards.
  # - It runs on every pull request and manual dispatch alike, so whichever run's `browser-tests`
  #   result satisfies branch protection has burned in.
  # - A branch that changes no spec or helper stops after the plan.
  browser-burn-in-plan:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.plan.outputs.specs }}
      repeat: ${{ steps.plan.outputs.repeat }}
    steps:
      # Full history without file contents, so the merge base with main is cheap to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: plan
        run: npx tsx scripts/burn-in-plan.ts origin/main

  browser-burn-in:
    needs: browser-burn-in-plan
    if: needs.browser-burn-in-plan.outputs.specs != ''
    name: browser-burn-in shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: previews
        run: |
          contract=$(npx tsx scripts/preview-pages.ts --cache-contract)
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ steps.previews.outputs.contract }}-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/engine/**', 'src/content/sets/index.ts', 'src/content/sets/*/*.json', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp', 'package-lock.json') }}
          restore-keys: previews-${{ steps.previews.outputs.contract }}-
      - env:
          SPECS: ${{ needs.browser-burn-in-plan.outputs.specs }}
          REPEAT: ${{ needs.browser-burn-in-plan.outputs.repeat }}
          SHARD: ${{ matrix.shard }}
        run: |
          # SPECS is a space-separated list of spec paths, split on purpose.
          # shellcheck disable=SC2086
          npx playwright test $SPECS --repeat-each="$REPEAT" --shard="$SHARD/3"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results-burn-in-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Reviewed screenshots of the core screens (#745). Pixels depend on the browser build and the
  # font rasteriser, so this runs in the pinned Playwright image (tag matching the lockfile's
  # @playwright/test, pinned by digest), the same one docs/DEVELOPMENT.md runs locally to update a
  # baseline. CI never writes a baseline: a mismatch fails and uploads the expected, actual and diff
  # images, and a reviewer looks at the new image on the PR before it lands.
  visual-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      # The runner's uid, as in cross-browser-smoke, so the checkout and npm cache stay writable.
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: previews
        run: |
          contract=$(npx tsx scripts/preview-pages.ts --cache-contract)
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ steps.previews.outputs.contract }}-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/engine/**', 'src/content/sets/index.ts', 'src/content/sets/*/*.json', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp', 'package-lock.json') }}
          restore-keys: previews-${{ steps.previews.outputs.contract }}-
      # Never writes a baseline, even a missing one: a new screen fails until its reviewed image lands.
      - run: npm run test:visual -- --update-snapshots=none
      # Only the images: the expected, actual and diff PNG of each mismatched screen, a few MB at most.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-baselines-diff
          path: test-results/visual/**/*.png
          retention-days: 7

  # The check that branch protection and reviews look for. It passes only when every shard and the
  # visual baselines passed, the burn-in plan ran, and the burn-in either passed or was skipped
  # because the plan found no spec.
  browser-tests:
    needs: [browser-shard, visual-baselines, browser-burn-in-plan, browser-burn-in]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard and the burn-in to pass
        env:
          RESULT: ${{ needs.browser-shard.result }}
          VISUAL: ${{ needs.visual-baselines.result }}
          PLAN: ${{ needs.browser-burn-in-plan.result }}
          SPECS: ${{ needs.browser-burn-in-plan.outputs.specs }}
          BURN_IN: ${{ needs.browser-burn-in.result }}
        run: |
          echo "Shards: $RESULT. Visual baselines: $VISUAL. Burn-in plan: $PLAN. Burn-in: $BURN_IN"
          test "$RESULT" = success
          test "$VISUAL" = success
          test "$PLAN" = success
          test "$BURN_IN" = success || { test "$BURN_IN" = skipped && test -z "$SPECS"; }
