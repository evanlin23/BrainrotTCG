name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for its own token scopes; none is granted by default.
permissions: {}

# One deploy of main at a time: a newer push to main cancels this run. The group is per ref, so a
# manual run from another branch (which the site guard then fails) can't cancel a run of main. With
# the main-ref guard in site and the tip-of-main guard that starts publish and deploy (so re-running
# a run whose commit main has moved past, or just its publish or deploy job, fails), this is what
# keeps an older commit's build from publishing over a newer one. Runs on main's current commit,
# such as Hall of Fame refreshes, are not told apart: re-running an earlier one still passes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Who holds what (docs/HOSTING.md; scripts/deploy_contract.py checks it on every pull request):
# - site holds the Cloudflare secrets for one lookup and runs no repository code;
# - build runs the app and its dependencies with no secrets and a read-only token, and seals what
#   it built for Cloudflare;
# - publish deploys the sealed files with Wrangler from its own lockfile, then waits until the new
#   address serves exactly them;
# - deploy holds the GitHub Pages write scopes and runs no repository dependencies.
jobs:
  independent-verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==50.0.1
      - run: python -I spec/verify_pull.py --vectors spec/vectors.json spec/vectors-python.json

  site:
    # The first job with secrets, so verification and the source check gate everything after it.
    needs: independent-verifier
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.site.outputs.host }}
      url: ${{ steps.site.outputs.url }}
      base: ${{ steps.site.outputs.base }}
    steps:
      - name: Require the main source ref
        env:
          SOURCE_REF: ${{ github.ref }}
        # Shell comparison is case-sensitive; Actions expression equality is not.
        run: test "$SOURCE_REF" = refs/heads/main
      # Where the site lives: Cloudflare Pages once its two secrets are set (docs/HOSTING.md),
      # otherwise GitHub Pages as before. Secrets only reach this step through its environment.
      - id: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'brainrottcg' }}
          CUSTOM_URL: ${{ vars.SITE_URL }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          github() { { echo "host=github"; echo "url=https://$OWNER.github.io/$REPO/"; echo "base=/$REPO/"; } >> "$GITHUB_OUTPUT"; }
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then github; exit 0; fi
          # The project's address, creating the project on the first run. If Cloudflare isn't ready
          # (a wrong ID or token, or a new account, which can't create projects for 48 hours), say
          # why and keep deploying to GitHub Pages, so the site never stops updating.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          res=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$PROJECT" || true)
          if [ "$(echo "$res" | jq -r '.success' 2>/dev/null)" != true ]; then
            res=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" "$api" || true)
          fi
          sub=$(echo "$res" | jq -r '.result.subdomain // empty' 2>/dev/null || true)
          if [ -z "$sub" ]; then
            echo "::warning::Cloudflare Pages isn't ready, so this deploy stays on GitHub Pages. Cloudflare said: $(echo "$res" | jq -c '.errors // .' 2>/dev/null || echo "$res")"
            github; exit 0
          fi
          echo "Cloudflare Pages project $PROJECT: https://$sub/"
          # SITE_URL may end in any number of /; everything after this sees it ending in exactly one.
          url=${CUSTOM_URL:-https://$sub/}
          while [ "${url%/}" != "$url" ]; do url=${url%/}; done
          { echo "host=cloudflare"; echo "url=$url/"; echo "base=/"; } >> "$GITHUB_OUTPUT"

  build:
    # Runs the app's dependencies, so it gets no secrets and a read-only token.
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      # Verify Hall of Fame issues and bake the list into the site. Results for issues unchanged
      # since the last deploy are cached; the key covers everything that decides a result.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hof-build-cache.json
          key: hof-build-${{ hashFiles('src/engine/**', 'src/content/sets/**/*.json', 'src/content/sets/index.ts', 'scripts/hall-of-fame.ts') }}-${{ github.run_id }}
          restore-keys: hof-build-${{ hashFiles('src/engine/**', 'src/content/sets/**/*.json', 'src/content/sets/index.ts', 'scripts/hall-of-fame.ts') }}-
      - run: npx tsx scripts/hall-of-fame.ts build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hof-build-cache.json
          key: hof-build-${{ hashFiles('src/engine/**', 'src/content/sets/**/*.json', 'src/content/sets/index.ts', 'scripts/hall-of-fame.ts') }}-${{ github.run_id }}
      # Link-preview pictures (scripts/preview-pages.ts) take minutes to draw from scratch; keep them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp') }}
          restore-keys: previews-
      # After a move, the build knows the old address, so it can take saves handed over from it
      # (src/game/move.ts); a build that hasn't moved has no old address and takes nothing.
      - run: npm run build
        env:
          BASE_PATH: ${{ needs.site.outputs.base }}
          SITE_URL: ${{ needs.site.outputs.url }}
          VITE_OLD_ORIGIN: ${{ needs.site.outputs.host == 'cloudflare' && format('https://{0}.github.io', github.repository_owner) || '' }}
          VITE_OLD_SITE_URL: ${{ needs.site.outputs.host == 'cloudflare' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
      # The old address forwards to the new one, bringing saves along. Drawn here, so the jobs that
      # publish run no app code; deploy publishes it only after the new address serves this build.
      - name: Build the old address's forwarding pages
        if: needs.site.outputs.host == 'cloudflare'
        env:
          URL: ${{ needs.site.outputs.url }}
          OLD_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npx tsx scripts/redirect-site.ts "$URL" pages
          # Old shared links keep their card preview, and forward through the page above.
          OUT_DIR=pages PAGES_ONLY=1 BASE_PATH="$OLD_BASE_PATH" SITE_URL="$URL" npx tsx scripts/preview-pages.ts
      # Hand Cloudflare's files to publish sealed: a manifest of every file's hash, whose own hash
      # travels as a job output, plus dist/deployment-id.json naming this run for the address check.
      - name: Seal the files for Cloudflare Pages
        id: seal
        if: needs.site.outputs.host == 'cloudflare'
        env:
          SITE_URL: ${{ needs.site.outputs.url }}
        run: |
          mkdir release
          mv dist release/dist
          python3 -I scripts/deploy_contract.py seal release >> "$GITHUB_OUTPUT"
      # Kept one day, like the Pages upload below: publish and deploy only take this run's uploads,
      # so a re-run more than a day later must re-run all jobs, starting from build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: handoff
        if: needs.site.outputs.host == 'cloudflare'
        with:
          name: cloudflare-site-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      # Always runs: on GitHub Pages it is the game itself, on Cloudflare the redirect pages.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ needs.site.outputs.host == 'cloudflare' && 'pages' || 'dist' }}

  publish:
    # Cloudflare only; on GitHub Pages every step is skipped and deploy goes ahead.
    needs: [site, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fails a re-run whose commit main has moved past, which would put an older build over a newer
      # one (see concurrency). It compares commits, not runs: Hall of Fame refreshes start several runs
      # on one commit, so re-running an earlier one still passes and serves its older list until the next.
      - name: Require the tip of main
        if: needs.site.outputs.host == 'cloudflare'
        run: |
          if ! refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main); then
            echo "::error::Could not read the tip of main, so not publishing $GITHUB_SHA. git ls-remote failed; re-run this job once GitHub is reachable."
            exit 1
          fi
          tip=$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/main" {print $1}')
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::Not publishing $GITHUB_SHA: main is now at ${tip:-a commit this job could not read}. Re-running a deploy whose commit is no longer main's tip would put an older build over a newer one. If no newer deploy run is in progress, start this workflow on main by hand (Actions > Deploy to GitHub Pages > Run workflow)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.site.outputs.host == 'cloudflare'
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/deploy_contract.py
            /tools/wrangler/
          sparse-checkout-cone-mode: false
      # By ID, so it's the exact upload build made in this run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.site.outputs.host == 'cloudflare'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
      - name: Check the files are the ones build sealed
        if: needs.site.outputs.host == 'cloudflare'
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          SITE_URL: ${{ needs.site.outputs.url }}
        run: python3 -I scripts/deploy_contract.py verify release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.site.outputs.host == 'cloudflare'
        with:
          node-version: 22
          package-manager-cache: false
      # Wrangler installs from its own lockfile (tools/wrangler), apart from the app's dependencies
      # and without the secrets. Install scripts are skipped: esbuild and workerd ship their
      # binaries as optional packages, and a static deploy doesn't use them.
      - name: Install Wrangler
        if: needs.site.outputs.host == 'cloudflare'
        run: npm ci --prefix tools/wrangler --ignore-scripts
      - name: Deploy to Cloudflare Pages
        if: needs.site.outputs.host == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'brainrottcg' }}
        run: tools/wrangler/node_modules/.bin/wrangler pages deploy release/dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true
      # The old address only starts forwarding once the new one serves this exact build.
      - name: Check the new address serves this build
        if: needs.site.outputs.host == 'cloudflare'
        env:
          URL: ${{ needs.site.outputs.url }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS --max-time 15 "${URL%/}/deployment-id.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | cmp -s release/dist/deployment-id.json - && exit 0
            sleep 10
          done
          echo "::error::$URL isn't serving this build"; exit 1

  deploy:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails a re-run whose commit main has moved past, which would put an older build over a newer
      # one (see concurrency). It compares commits, not runs: Hall of Fame refreshes start several runs
      # on one commit, so re-running an earlier one still passes and serves its older list until the next.
      - name: Require the tip of main
        run: |
          if ! refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main); then
            echo "::error::Could not read the tip of main, so not publishing $GITHUB_SHA. git ls-remote failed; re-run this job once GitHub is reachable."
            exit 1
          fi
          tip=$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/main" {print $1}')
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::Not publishing $GITHUB_SHA: main is now at ${tip:-a commit this job could not read}. Re-running a deploy whose commit is no longer main's tip would put an older build over a newer one. If no newer deploy run is in progress, start this workflow on main by hand (Actions > Deploy to GitHub Pages > Run workflow)."
            exit 1
          fi
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
