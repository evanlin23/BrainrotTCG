name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for its own token scopes; none is granted by default.
permissions: {}

# One deploy of main at a time: a newer push to main cancels this run. The group is per ref, so a
# manual run from another branch (which the site guard then fails) can't cancel a run of main. With
# the main-ref guard in site and the tip-of-main guard that starts publish and deploy (so re-running
# a run whose commit main has moved past, or just its publish or deploy job, fails), this is what
# keeps an older commit's build from publishing over a newer one. Runs on main's current commit,
# such as Hall of Fame refreshes, are not told apart: re-running an earlier one still passes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Who holds what (docs/HOSTING.md; scripts/deploy_contract.py checks it on every pull request):
# - site holds the Cloudflare secrets for one lookup and runs no repository code;
# - build runs the app and its dependencies with no secrets and a read-only token, and seals what
#   it built for Cloudflare;
# - with staging on (docs/HOSTING.md#staging), stage deploys the sealed files to the staging branch's
#   own address and checks it serves exactly them, and staging-checks runs the browser checks there
#   with no secret but the Access service token, in the steps that fetch staging; otherwise every
#   step of both is skipped;
# - release-gate decides, with no secrets and a read-only token, whether this commit may be released
#   while any recorded release blocker is open (docs/HOSTING.md#release-blocker-criteria-and-promotion-eligibility);
# - publish waits for it, deploys the same sealed files with Wrangler from its own lockfile, then
#   waits until the new address serves exactly them;
# - deploy holds the GitHub Pages write scopes and runs no repository dependencies;
# - smoke then checks production read-only, with no secrets and a read-only token, within 15 minutes.
# The jobs holding the Cloudflare secrets run in the cloudflare-production environment.
jobs:
  independent-verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==50.0.1
      - run: python -I spec/verify_pull.py --vectors spec/vectors.json spec/vectors-python.json

  site:
    # The first job with secrets, so verification and the source check gate everything after it.
    needs: independent-verifier
    runs-on: ubuntu-latest
    environment: cloudflare-production
    outputs:
      host: ${{ steps.site.outputs.host }}
      url: ${{ steps.site.outputs.url }}
      base: ${{ steps.site.outputs.base }}
      pages: ${{ steps.site.outputs.pages }}
      staging_branch: ${{ steps.site.outputs.staging_branch }}
      staging_url: ${{ steps.site.outputs.staging_url }}
    steps:
      - name: Require the main source ref
        env:
          SOURCE_REF: ${{ github.ref }}
        # Shell comparison is case-sensitive; Actions expression equality is not.
        run: test "$SOURCE_REF" = refs/heads/main
      # Where the site lives: Cloudflare Pages once its two secrets are set (docs/HOSTING.md),
      # otherwise GitHub Pages as before. Secrets only reach this step through its environment.
      # With staging on, also where staging lives, or a refusal to deploy at all.
      - id: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'brainrottcg' }}
          CUSTOM_URL: ${{ vars.SITE_URL }}
          STAGING_BRANCH: ${{ vars.CLOUDFLARE_STAGING_BRANCH }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          github() { { echo "host=github"; echo "url=https://$OWNER.github.io/$REPO/"; echo "base=/$REPO/"; } >> "$GITHUB_OUTPUT"; }
          # With staging on, every release goes through it, so when staging can't work nothing is
          # published anywhere (not even GitHub Pages) until it is fixed or the variable is deleted.
          refuse() {
            if [ -n "$STAGING_BRANCH" ]; then
              echo "::error::Staging is on (CLOUDFLARE_STAGING_BRANCH), so nothing is published until it works: $1. Fix that, or delete the variable to deploy without staging (docs/HOSTING.md#staging)."
              exit 1
            fi
          }
          if [ -n "$STAGING_BRANCH" ] && ! [[ "$STAGING_BRANCH" =~ ^[a-z0-9]([a-z0-9-]{0,26}[a-z0-9])?$ ]]; then
            refuse 'CLOUDFLARE_STAGING_BRANCH must be 1 to 28 lowercase letters, digits and inner hyphens, such as staging'
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then refuse "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set"; github; exit 0; fi
          # The project's address, creating the project on the first run. If Cloudflare isn't ready
          # (a wrong ID or token, or a new account, which can't create projects for 48 hours), say
          # why and keep deploying to GitHub Pages, so the site never stops updating.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          res=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$PROJECT" || true)
          if [ "$(echo "$res" | jq -r '.success' 2>/dev/null)" != true ]; then
            res=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" "$api" || true)
          fi
          sub=$(echo "$res" | jq -r '.result.subdomain // empty' 2>/dev/null || true)
          if [ -z "$sub" ]; then
            said="Cloudflare said: $(echo "$res" | jq -c '.errors // .' 2>/dev/null || echo "$res")"
            refuse "Cloudflare Pages isn't ready. $said"
            echo "::warning::Cloudflare Pages isn't ready, so this deploy stays on GitHub Pages. $said"
            github; exit 0
          fi
          echo "Cloudflare Pages project $PROJECT: https://$sub/"
          # Pages serves a branch's preview at <branch>.<project host>, its own origin. With staging
          # on, the build treats any subdomain of the project host as staging (src/game/staging.ts);
          # with it off, pages stays empty and no address is staging.
          pages=
          staging_url=
          if [ -n "$STAGING_BRANCH" ]; then
            [[ "$sub" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.pages\.dev$ ]] || refuse "the project's address $sub isn't a pages.dev address"
            pages=$sub
            production=$(echo "$res" | jq -r '.result.production_branch // empty')
            if [ "$STAGING_BRANCH" = main ] || [ "$STAGING_BRANCH" = "$production" ]; then
              refuse "CLOUDFLARE_STAGING_BRANCH names the production branch"
            fi
            staging_url="https://$STAGING_BRANCH.$pages/"
            echo "Staging: $staging_url"
          else
            echo "::notice::Staging is off: this deploy publishes straight to production. Set CLOUDFLARE_STAGING_BRANCH to turn it on (docs/HOSTING.md#staging)."
          fi
          # SITE_URL may end in any number of /; everything after this sees it ending in exactly one.
          url=${CUSTOM_URL:-https://$sub/}
          while [ "${url%/}" != "$url" ]; do url=${url%/}; done
          { echo "host=cloudflare"; echo "url=$url/"; echo "base=/"; echo "pages=$pages"; echo "staging_branch=$STAGING_BRANCH"; echo "staging_url=$staging_url"; } >> "$GITHUB_OUTPUT"

  build:
    # Runs the app's dependencies, so it gets no secrets and a read-only token.
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      # Every old vector and set lock entry is still there, unchanged (docs/ARCHITECTURE.md,
      # Compatibility rules): compared with main before this push, or the parent for a manual run.
      # The base is fetched by SHA from the public repository without a token and read as data.
      # A run cancelled by a later push or dispatch (see concurrency) leaves its range unchecked
      # here; only the pull request gate covers it (docs/ARCHITECTURE.md, Base).
      - name: Keep old vectors and set locks
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
            base=$(git rev-parse "$GITHUB_SHA^1")
          else
            git fetch --no-tags --depth=1 origin "$BEFORE"
            base=$BEFORE
          fi
          npm run check:history -- --base "$base"
      # Verify Hall of Fame issues and bake the list into the site. Results for issues unchanged
      # since the last deploy are cached; the key covers everything that decides a result.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hof-build-cache.json
          key: hof-build-${{ hashFiles('src/engine/**', 'src/content/sets/**/*.json', 'src/content/sets/index.ts', 'scripts/hall-of-fame.ts') }}-${{ github.run_id }}
          restore-keys: hof-build-${{ hashFiles('src/engine/**', 'src/content/sets/**/*.json', 'src/content/sets/index.ts', 'scripts/hall-of-fame.ts') }}-
      - run: npx tsx scripts/hall-of-fame.ts build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hof-build-cache.json
          key: hof-build-${{ hashFiles('src/engine/**', 'src/content/sets/**/*.json', 'src/content/sets/index.ts', 'scripts/hall-of-fame.ts') }}-${{ github.run_id }}
      # Link-preview pictures (scripts/preview-pages.ts) take minutes to draw from scratch; keep them.
      # The key covers everything that decides which pictures there are and how they look. Their
      # cache contract (the script, sharp's versions, PREVIEW_CACHE_VERSION) starts the restore
      # prefix too, so pictures drawn under an older contract are never restored.
      - id: previews
        run: |
          contract=$(npx tsx scripts/preview-pages.ts --cache-contract)
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ steps.previews.outputs.contract }}-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/engine/**', 'src/content/sets/index.ts', 'src/content/sets/*/*.json', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp', 'package-lock.json') }}
          restore-keys: previews-${{ steps.previews.outputs.contract }}-
      # After a move, the build knows the old address, so it can take saves handed over from it
      # (src/game/move.ts); a build that hasn't moved has no old address and takes nothing.
      # The same files serve production and staging; at run time a page at a subdomain of the
      # Cloudflare project host knows it is staging (src/game/staging.ts). With staging off the
      # suffix is empty, so no address is staging.
      - run: npm run build
        env:
          BASE_PATH: ${{ needs.site.outputs.base }}
          SITE_URL: ${{ needs.site.outputs.url }}
          VITE_STAGING_HOST_SUFFIX: ${{ needs.site.outputs.pages }}
          VITE_OLD_ORIGIN: ${{ needs.site.outputs.host == 'cloudflare' && format('https://{0}.github.io', github.repository_owner) || '' }}
          VITE_OLD_SITE_URL: ${{ needs.site.outputs.host == 'cloudflare' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
      # The old address forwards to the new one, bringing saves along. Drawn here, so the jobs that
      # publish run no app code; deploy publishes it only after the new address serves this build.
      - name: Build the old address's forwarding pages
        if: needs.site.outputs.host == 'cloudflare'
        env:
          URL: ${{ needs.site.outputs.url }}
          OLD_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npx tsx scripts/redirect-site.ts "$URL" pages
          # Old shared links keep their card preview, and forward through the page above.
          OUT_DIR=pages PAGES_ONLY=1 BASE_PATH="$OLD_BASE_PATH" SITE_URL="$URL" npx tsx scripts/preview-pages.ts
      # Hand Cloudflare's files to publish sealed: a manifest of every file's hash, whose own hash
      # travels as a job output, plus dist/deployment-id.json naming this run for the address check.
      - name: Seal the files for Cloudflare Pages
        id: seal
        if: needs.site.outputs.host == 'cloudflare'
        env:
          SITE_URL: ${{ needs.site.outputs.url }}
        run: |
          mkdir release
          mv dist release/dist
          python3 -I scripts/deploy_contract.py seal release >> "$GITHUB_OUTPUT"
      # Kept one day, like the Pages upload below: publish and deploy only take this run's uploads,
      # so a re-run more than a day later must re-run all jobs, starting from build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: handoff
        if: needs.site.outputs.host == 'cloudflare'
        with:
          name: cloudflare-site-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      # Always runs: on GitHub Pages it is the game itself, on Cloudflare the redirect pages.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ needs.site.outputs.host == 'cloudflare' && 'pages' || 'dist' }}

  stage:
    # Staging only (docs/HOSTING.md#staging); otherwise every step is skipped and publish goes ahead.
    # Puts build's sealed files on the staging branch's own address, the way publish puts them on
    # production, and checks that address serves every one of them as sealed.
    needs: [site, build]
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      # A re-run whose commit main has moved past must not put an older build on staging either.
      - name: Require the tip of main
        if: needs.site.outputs.staging_url != ''
        run: |
          if ! refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main); then
            echo "::error::Could not read the tip of main, so not publishing $GITHUB_SHA. git ls-remote failed; re-run this job once GitHub is reachable."
            exit 1
          fi
          tip=$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/main" {print $1}')
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::Not publishing $GITHUB_SHA: main is now at ${tip:-a commit this job could not read}. Re-running a deploy whose commit is no longer main's tip would put an older build over a newer one. If no newer deploy run is in progress, start this workflow on main by hand (Actions > Deploy to GitHub Pages > Run workflow)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.site.outputs.staging_url != ''
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/deploy_contract.py
            /tools/wrangler/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.site.outputs.staging_url != ''
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
      - name: Check the files are the ones build sealed
        if: needs.site.outputs.staging_url != ''
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          SITE_URL: ${{ needs.site.outputs.url }}
        run: python3 -I scripts/deploy_contract.py verify release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.site.outputs.staging_url != ''
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Wrangler
        if: needs.site.outputs.staging_url != ''
        run: npm ci --prefix tools/wrangler --ignore-scripts
      # Any branch but the production one makes a preview deployment, served at <branch>.<project host>.
      - name: Deploy to Cloudflare Pages staging
        if: needs.site.outputs.staging_url != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'brainrottcg' }}
          BRANCH: ${{ needs.site.outputs.staging_branch }}
        run: tools/wrangler/node_modules/.bin/wrangler pages deploy release/dist --project-name="$PROJECT" --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true
      # Staging is a preview deployment, which the project's Cloudflare Access app may cover: the steps
      # that fetch it send the Access service token, if set, to the staging address only, and fail
      # naming the token when Access refuses them (docs/HOSTING.md#staging).
      - name: Check staging serves this build
        if: needs.site.outputs.staging_url != ''
        env:
          URL: ${{ needs.site.outputs.staging_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python3 -I scripts/deploy_contract.py deployed release "$URL"
      - name: Check staging serves every sealed file
        if: needs.site.outputs.staging_url != ''
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          SITE_URL: ${{ needs.site.outputs.url }}
          URL: ${{ needs.site.outputs.staging_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python3 -I scripts/deploy_contract.py served release "$URL" >> "$GITHUB_STEP_SUMMARY"

  staging-checks:
    # Staging only. The browser checks run the app's dependencies, so this job gets a read-only token
    # and no secret but the Access service token, which only reads preview deployments, in the two
    # steps that fetch staging. It tests the deployed staging address, with build's sealed files as
    # ./dist for the checks that read it: nothing here is rebuilt.
    needs: [site, build, stage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.site.outputs.staging_url != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.site.outputs.staging_url != ''
        with:
          node-version: 22
          cache: npm
      - if: needs.site.outputs.staging_url != ''
        run: npm ci
      - if: needs.site.outputs.staging_url != ''
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.site.outputs.staging_url != ''
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
      - name: Check the files are the ones build sealed
        if: needs.site.outputs.staging_url != ''
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          SITE_URL: ${{ needs.site.outputs.url }}
        run: python3 -I scripts/deploy_contract.py verify release
      - if: needs.site.outputs.staging_url != ''
        run: cp -R release/dist dist
      # stage saw staging serve this run's files, but a later run on the same commit may have
      # replaced them since (re-running this job after it). Test only this run's files, or stop
      # before publish.
      - name: Check staging still serves this build
        if: needs.site.outputs.staging_url != ''
        env:
          URL: ${{ needs.site.outputs.staging_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python3 -I scripts/deploy_contract.py deployed release "$URL" --once
      # The network guard sends the Access token to the staging origin only (playwright.staging.config.ts).
      - name: Browser checks on staging
        if: needs.site.outputs.staging_url != ''
        env:
          STAGING_URL: ${{ needs.site.outputs.staging_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test -c playwright.staging.config.ts

  release-gate:
    # Production waits for the release-blocker decision on this exact commit
    # (scripts/release-blockers.ts): publish needs this job, and deploy needs publish. The base is
    # main's tip, fetched here rather than taken from the checkout, so the record on main is the
    # authority, and a commit that isn't on main is refused. It runs repository code, so it gets no
    # secrets and a read-only token. Staging doesn't wait: a blocked commit can still be tried there.
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: a resolved blocker's fix commit must be in this commit's history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse a release while a release blocker is open
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          npx tsx scripts/release-blockers.ts --candidate "$GITHUB_SHA" --base origin/main --require-on-base

  publish:
    # Cloudflare only; on GitHub Pages every step is skipped and deploy goes ahead. It runs only once
    # release-gate allowed this commit and, with staging on, staging served and passed these very files.
    needs: [site, build, stage, staging-checks, release-gate]
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      # Fails a re-run whose commit main has moved past, which would put an older build over a newer
      # one (see concurrency). It compares commits, not runs: Hall of Fame refreshes start several runs
      # on one commit, so re-running an earlier one still passes and serves its older list until the next.
      - name: Require the tip of main
        if: needs.site.outputs.host == 'cloudflare'
        run: |
          if ! refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main); then
            echo "::error::Could not read the tip of main, so not publishing $GITHUB_SHA. git ls-remote failed; re-run this job once GitHub is reachable."
            exit 1
          fi
          tip=$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/main" {print $1}')
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::Not publishing $GITHUB_SHA: main is now at ${tip:-a commit this job could not read}. Re-running a deploy whose commit is no longer main's tip would put an older build over a newer one. If no newer deploy run is in progress, start this workflow on main by hand (Actions > Deploy to GitHub Pages > Run workflow)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.site.outputs.host == 'cloudflare'
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/deploy_contract.py
            /tools/wrangler/
          sparse-checkout-cone-mode: false
      # By ID, so it's the exact upload build made in this run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.site.outputs.host == 'cloudflare'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
      - name: Check the files are the ones build sealed
        if: needs.site.outputs.host == 'cloudflare'
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          SITE_URL: ${{ needs.site.outputs.url }}
        run: python3 -I scripts/deploy_contract.py verify release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.site.outputs.host == 'cloudflare'
        with:
          node-version: 22
          package-manager-cache: false
      # Wrangler installs from its own lockfile (tools/wrangler), apart from the app's dependencies
      # and without the secrets. Install scripts are skipped: esbuild and workerd ship their
      # binaries as optional packages, and a static deploy doesn't use them.
      - name: Install Wrangler
        if: needs.site.outputs.host == 'cloudflare'
        run: npm ci --prefix tools/wrangler --ignore-scripts
      - name: Deploy to Cloudflare Pages
        if: needs.site.outputs.host == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'brainrottcg' }}
        run: tools/wrangler/node_modules/.bin/wrangler pages deploy release/dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true
      # The old address only starts forwarding once the new one serves this exact build.
      - name: Check the new address serves this build
        if: needs.site.outputs.host == 'cloudflare'
        env:
          URL: ${{ needs.site.outputs.url }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS --max-time 15 "${URL%/}/deployment-id.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | cmp -s release/dist/deployment-id.json - && exit 0
            sleep 10
          done
          echo "::error::$URL isn't serving this build"; exit 1
      # With staging on, production must now serve exactly what staging served and passed.
      - name: Check production serves every sealed file
        if: needs.site.outputs.staging_url != ''
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          SITE_URL: ${{ needs.site.outputs.url }}
          URL: ${{ needs.site.outputs.url }}
        run: python3 -I scripts/deploy_contract.py served release "$URL" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails a re-run whose commit main has moved past, which would put an older build over a newer
      # one (see concurrency). It compares commits, not runs: Hall of Fame refreshes start several runs
      # on one commit, so re-running an earlier one still passes and serves its older list until the next.
      - name: Require the tip of main
        run: |
          if ! refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main); then
            echo "::error::Could not read the tip of main, so not publishing $GITHUB_SHA. git ls-remote failed; re-run this job once GitHub is reachable."
            exit 1
          fi
          tip=$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/main" {print $1}')
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::Not publishing $GITHUB_SHA: main is now at ${tip:-a commit this job could not read}. Re-running a deploy whose commit is no longer main's tip would put an older build over a newer one. If no newer deploy run is in progress, start this workflow on main by hand (Actions > Deploy to GitHub Pages > Run workflow)."
            exit 1
          fi
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  smoke:
    # Read-only checks that production (and, on Cloudflare, the old address) serves this release,
    # once publish and deploy are done (scripts/production-smoke.ts, docs/HOSTING.md). GETs only:
    # the browser checks refuse every write and every request to another origin. A failure turns
    # this run red; the last step always runs, and calls the release known-good only when both
    # checks passed, or else, when one failed, names the release to go back to. It gives no verdict
    # when a check didn't finish (cancelled or skipped), main has moved past this commit, or
    # production serves a newer run. Nothing is uploaded or kept.
    needs: [site, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app's dependencies run here, with no secrets and a read-only token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check production serves this release
        id: http
        env:
          SITE_URL: ${{ needs.site.outputs.url }}
          HOST: ${{ needs.site.outputs.host }}
          OLD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npx tsx scripts/production-smoke.ts >> "$GITHUB_STEP_SUMMARY"
      - run: npx playwright install --with-deps chromium
      - name: Browser checks on production
        id: browser
        env:
          PRODUCTION_URL: ${{ needs.site.outputs.url }}
        run: npx playwright test -c playwright.production.config.ts
      # Runs whatever the checks did: names the rollback target when either failed, and gives no
      # verdict when one didn't finish, this commit is no longer main's tip (git ls-remote), or the
      # marker names a newer run.
      - name: Record the release status
        if: always()
        env:
          SITE_URL: ${{ needs.site.outputs.url }}
          HOST: ${{ needs.site.outputs.host }}
          OLD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_TOKEN: ${{ github.token }}
          HTTP_OUTCOME: ${{ steps.http.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: npx tsx scripts/production-smoke.ts --status >> "$GITHUB_STEP_SUMMARY"
