name: Hall of Fame

# Verifies pull links submitted through the Hall of Fame issue form.
# Issue text is untrusted: it is only parsed by scripts/hall-of-fame.ts,
# never interpolated into shell commands.
on:
  issues:
    types: [opened, edited, reopened]

# Each job gets only what it uses.
permissions: {}

concurrency:
  group: hall-of-fame-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[Hall of Fame]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      verified: ${{ steps.check.outputs.verified }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        run: npx tsx scripts/hall-of-fame.ts verify-issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Comment and label
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          VERIFIED: ${{ steps.check.outputs.verified }}
        run: |
          gh label create hall-of-fame --color FF3DF2 --description "Hall of Fame submission" 2>/dev/null || true
          gh label create verified --color 2BFF6A --description "Pull verified" 2>/dev/null || true
          gh label create not-verified --color 999999 --description "Pull did not verify or qualify" 2>/dev/null || true
          gh issue comment "$ISSUE" --body-file hof-comment.md
          if [ "$VERIFIED" = "true" ]; then
            gh issue edit "$ISSUE" --add-label hall-of-fame,verified
            gh issue edit "$ISSUE" --remove-label not-verified 2>/dev/null || true
            # Done: closed issues stay in the Hall of Fame (the deploy reads every state). One that
            # didn't verify stays open, so the submitter can fix the link.
            gh issue close "$ISSUE" --reason completed 2>/dev/null || true
          else
            gh issue edit "$ISSUE" --add-label hall-of-fame,not-verified
            gh issue edit "$ISSUE" --remove-label verified 2>/dev/null || true
          fi

  # The only job that can start a deploy, and all it can do. It runs only if verify succeeded.
  redeploy:
    name: Redeploy so the entry goes live
    needs: verify
    if: needs.verify.outputs.verified == 'true' && needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so gh is told the repository.
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: gh workflow run deploy.yml --ref "$REF"
