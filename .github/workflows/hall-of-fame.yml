name: Hall of Fame

# Verifies pull links submitted through the Hall of Fame issue form.
# Issue text is untrusted: it is only parsed by scripts/hall-of-fame.ts,
# never interpolated into shell commands.
on:
  issues:
    types: [opened, edited, reopened]

# Each job gets only what it uses.
permissions: {}

concurrency:
  group: hall-of-fame-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[Hall of Fame]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      verified: ${{ steps.check.outputs.verified }}
      changed: ${{ steps.check.outputs.changed }}
      redeploy: ${{ steps.check.outputs.redeploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        run: npx tsx scripts/hall-of-fame.ts verify-issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Comment and label
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          VERIFIED: ${{ steps.check.outputs.verified }}
          LABEL: ${{ steps.check.outputs.label }}
          REJECTED: ${{ steps.check.outputs.rejected }}
        run: |
          gh label create hall-of-fame --color FF3DF2 --description "Hall of Fame submission" 2>/dev/null || true
          gh label create verified --color 2BFF6A --description "Pull verified" 2>/dev/null || true
          gh label create daily --color 2BD9FF --description "Pull verified for the daily top" 2>/dev/null || true
          gh label create not-verified --color 999999 --description "Pull did not verify or qualify" 2>/dev/null || true
          gh label create rejected --color B60205 --description "Kept out of the Hall of Fame" 2>/dev/null || true
          if [ -s hof-comment.md ]; then
            gh issue comment "$ISSUE" --body-file hof-comment.md
          fi
          if [ "$VERIFIED" = "true" ]; then
            # `daily`: it only made the day's top, so deploys list it for a day or two. Anything
            # else is `verified`, which every deploy lists.
            if [ "$LABEL" = "daily" ]; then OTHER=verified; else LABEL=verified; OTHER=daily; fi
            gh issue edit "$ISSUE" --add-label "hall-of-fame,$LABEL"
            gh issue edit "$ISSUE" --remove-label not-verified 2>/dev/null || true
            gh issue edit "$ISSUE" --remove-label "$OTHER" 2>/dev/null || true
            # Done: closed issues stay in the Hall of Fame (the deploy reads every state). One that
            # didn't verify stays open, so the submitter can fix the link.
            gh issue close "$ISSUE" --reason completed 2>/dev/null || true
          else
            gh issue edit "$ISSUE" --add-label hall-of-fame,not-verified
            gh issue edit "$ISSUE" --remove-label verified 2>/dev/null || true
            gh issue edit "$ISSUE" --remove-label daily 2>/dev/null || true
            # A display name that isn't allowed keeps the issue out of every deploy. Only the owner
            # removes `rejected`, since they add it by hand too.
            if [ "$REJECTED" = "true" ]; then gh issue edit "$ISSUE" --add-label rejected; fi
          fi

  # The only job that can start a deploy, and all it can do. It runs only if verify succeeded, for a
  # new verification, or a label repair after a run that stopped before labelling (see verify-issue).
  redeploy:
    name: Redeploy so the entry goes live
    needs: verify
    if: needs.verify.outputs.verified == 'true' && needs.verify.outputs.redeploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so gh is told the repository.
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: gh workflow run deploy.yml --ref "$REF"
