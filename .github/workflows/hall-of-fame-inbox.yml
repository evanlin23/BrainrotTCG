name: Hall of Fame inbox

# Hall of Fame submissions sent without a GitHub account go to public Nostr
# relays (src/game/nostrInbox.ts). This reads them every 15 minutes, verifies
# each pull, and files the ones that qualify as Hall of Fame issues, so the
# deploy treats them like any other entry. Free: Actions minutes on public
# repositories cost nothing, and the relays are public.
#
# GitHub's schedule below has never fired for this repository, so a Cloudflare
# Worker (workers/hall-of-fame-cron/) dispatches this every 15 minutes; the
# schedule stays as a backup.
#
# Relay content is untrusted: it is only parsed by scripts/hall-of-fame.ts,
# never interpolated into shell commands.
on:
  schedule:
    # Off the quarter hours, which GitHub delays or drops under load.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Instead of reading the inbox, test these relays (space-separated wss:// URLs; "default" for the current list)'
        required: false
        default: ''

# Each job gets only what it uses.
permissions: {}

concurrency:
  group: hall-of-fame-inbox
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ inputs.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Passed through the environment, never interpolated into the command.
      - run: if [ "$RELAYS" = default ]; then npx tsx scripts/hall-of-fame.ts probe; else npx tsx scripts/hall-of-fame.ts probe $RELAYS; fi
        env:
          RELAYS: ${{ inputs.probe }}

  inbox:
    if: ${{ !inputs.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      added: ${{ steps.inbox.outputs.added }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create hall-of-fame --color FF3DF2 --description "Hall of Fame submission" 2>/dev/null || true
          gh label create verified --color 2BFF6A --description "Pull verified" 2>/dev/null || true
          gh label create daily --color 2BD9FF --description "Pull verified for the daily top" 2>/dev/null || true
      # Event ids already handled, so junk isn't re-checked on every run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hof-inbox-seen.json
          key: hof-inbox-seen-${{ github.run_id }}
          restore-keys: hof-inbox-seen-
      # Time ranges each relay was read through, so events past the page cap are read next run. Its
      # own cache, so adding it didn't change the seen cache's key or lose it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hof-inbox-read.json
          key: hof-inbox-read-${{ github.run_id }}
          restore-keys: hof-inbox-read-
      - id: inbox
        run: npx tsx scripts/hall-of-fame.ts inbox
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: hof-inbox-seen.json
          key: hof-inbox-seen-${{ github.run_id }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: hof-inbox-read.json
          key: hof-inbox-read-${{ github.run_id }}

  # The only job that can start a deploy, and all it can do. It runs only if inbox succeeded.
  redeploy:
    name: Redeploy so new entries go live
    needs: inbox
    if: needs.inbox.outputs.added != '' && needs.inbox.outputs.added != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so gh is told the repository.
          GH_REPO: ${{ github.repository }}
          # Scheduled runs are on the default branch, and their event has no repository field.
          REF: ${{ github.ref_name }}
        run: gh workflow run deploy.yml --ref "$REF"
        
