name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Link-preview pictures (scripts/preview-pages.ts) take minutes to draw from scratch; keep them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp') }}
          restore-keys: previews-
      - run: npm run build

  # A second, independent implementation of spec/PULL_SPEC.md (Python + OpenSSL) must agree with
  # the engine on every test vector.
  independent-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==50.0.1
      - run: python -I spec/verify_pull.py --vectors spec/vectors.json spec/vectors-python.json

  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download and verify actionlint
        run: |
          VERSION="1.7.12"
          TARBALL="actionlint_${VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="actionlint_${VERSION}_checksums.txt"
          curl -fsSL -O "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${TARBALL}"
          curl -fsSL -O "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${CHECKSUMS}"
          grep " ${TARBALL}\$" "${CHECKSUMS}" | sha256sum -c -
          tar -xzf "${TARBALL}" actionlint
          ./actionlint -shellcheck=''
