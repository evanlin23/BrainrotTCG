name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  # `npm run check` (package.json) split into stages that run side by side, so independent failures
  # show in one run, each in its own job with its own time. Together they run every part of it;
  # scripts/ci-stages.test.ts holds them to that. The `check` job below is the gate that branch
  # protection requires.
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:imports
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      # Two commits: on a pull request, GitHub's merge commit and the base it merges onto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # All unit and integration tests, with the coverage floors (vite.config.ts).
      - run: npm test
      # A pull request that changes the unit gate (vite.config.ts, src/test/, or a file the
      # escaped-defect replay reverts or owns; GATE_PATHS in the script) must still stop those real
      # defects. In a stage the required `check` gate needs, so a miss turns it red (docs/DEVELOPMENT.md).
      - name: Replay escaped defects when the gate changes
        if: github.event_name == 'pull_request'
        # Explicit bash runs with pipefail, so a failed diff fails the step instead of skipping it.
        shell: bash
        run: git diff --name-only HEAD^1 HEAD | npx tsx scripts/defect-replay.ts --if-gate-changed

  content-checks:
    runs-on: ubuntu-latest
    steps:
      # Two commits: on a pull request, GitHub's merge commit and the base it merges onto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:sets
      - run: npm run check:card-assets
      # Every old vector and set lock entry is still there, unchanged (docs/ARCHITECTURE.md,
      # Compatibility rules). The base files are read as data; nothing from the base runs.
      - name: Keep old vectors and set locks
        if: github.event_name == 'pull_request'
        run: npm run check:history -- --base HEAD^1

  build-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Link-preview pictures (scripts/preview-pages.ts) take minutes to draw from scratch; keep them.
      # The key covers everything that decides which pictures there are and how they look. Their
      # cache contract (the script, sharp's versions, PREVIEW_CACHE_VERSION) starts the restore
      # prefix too, so pictures drawn under an older contract are never restored.
      - id: previews
        run: |
          contract=$(npx tsx scripts/preview-pages.ts --cache-contract)
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/previews
          key: previews-${{ steps.previews.outputs.contract }}-${{ hashFiles('scripts/preview-pages.ts', 'src/game/previewLinks.ts', 'src/engine/**', 'src/content/sets/index.ts', 'src/content/sets/*/*.json', 'src/content/sets/*/cards/*', 'src/assets/images/card_back.webp', 'package-lock.json') }}
          restore-keys: previews-${{ steps.previews.outputs.contract }}-
      - run: npm run build
      # Every page's links stay under the base path, and every preview page and picture is there,
      # decodes and points at the site (scripts/check-site.ts).
      - run: npm run check:site
      # The deploy builds for the root on Cloudflare Pages (docs/HOSTING.md). The pictures don't
      # depend on the path, so this build draws none.
      - name: Build and check for the root path
        env:
          BASE_PATH: /
          SITE_URL: https://brainrottcg.pages.dev/
        run: npm run build && npm run check:site

  # The required `check`: it passes only when every stage passed. It runs even when a stage failed
  # or was cancelled, so it goes red then instead of being skipped, and a skipped stage fails it too.
  check:
    needs: [lint-and-types, unit-tests, content-checks, build-and-site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage to pass
        env:
          LINT: ${{ needs.lint-and-types.result }}
          TESTS: ${{ needs.unit-tests.result }}
          CONTENT: ${{ needs.content-checks.result }}
          SITE: ${{ needs.build-and-site.result }}
        run: |
          echo "Lint and types: $LINT. Unit tests: $TESTS. Content checks: $CONTENT. Build and site: $SITE"
          test "$LINT" = success
          test "$TESTS" = success
          test "$CONTENT" = success
          test "$SITE" = success

  # A second, independent implementation of spec/PULL_SPEC.md (Python + OpenSSL) must agree with
  # the engine on every test vector.
  independent-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==50.0.1
      - run: python -I spec/verify_pull.py --vectors spec/vectors.json spec/vectors-python.json

  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What deploy.yml promises (docs/HOSTING.md), read from the YAML, plus the seal and checks it runs.
      - name: Check the deploy contract
        run: python3 scripts/deploy_contract_test.py
      - name: Download and verify actionlint
        run: |
          VERSION="1.7.12"
          TARBALL="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -O "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${TARBALL}"
          # Pinned here rather than read from the same release; a new VERSION needs its new hash.
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${TARBALL}" | sha256sum -c -
          tar -xzf "${TARBALL}" actionlint
          ./actionlint -shellcheck=''
