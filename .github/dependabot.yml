version: 2
updates:
  # Minor and patch updates arrive as one PR per group, so each gets one review and one CI run.
  # Majors stay one PR per package: they need their own review (Vite 8 and ESLint 10 are adopted,
  # #463; TypeScript 7, #392, stays on 5.x).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
      # hash-wasm (Argon2id tickets) and @noble/* (proof signatures) can change pack and proof
      # derivation, so each of their updates stays a PR of its own.
      prod:
        dependency-type: production
        patterns: ["*"]
        exclude-patterns: ["hash-wasm", "@noble/*"]
        update-types: [minor, patch]

  # Wrangler for the Cloudflare Pages deploy, locked apart from the app (tools/wrangler).
  - package-ecosystem: npm
    directory: /tools/wrangler
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
