version: 2
updates:
  # Minor and patch updates arrive as one PR per group, so each gets one review and one CI run.
  # Majors stay one PR per package: they need their own review (the Vite 8, TypeScript 7 and
  # ESLint 10 majors, #390, #392, #397, are blocked upstream).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
      prod:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]

  # Wrangler for the Cloudflare Pages deploy, locked apart from the app (tools/wrangler).
  - package-ecosystem: npm
    directory: /tools/wrangler
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
